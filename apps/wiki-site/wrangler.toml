# Wrangler configuration for Tamma wiki/documentation site
# Deploys Astro Starlight to Cloudflare Workers

name = "tamma-wiki-site"
main = "dist/_worker.js"
compatibility_date = "2025-01-01"

# Assets configuration for serving static files (Astro output)
[assets]
directory = "./dist/client"

# Environment variables
[vars]
ENVIRONMENT = "production"

# Observability
[observability]
enabled = true

# Custom domains are configured in the Cloudflare dashboard:
#   - wiki.tamma.dev
#   - wiki.its-done.dev
#
# To add custom domains:
#   1. Go to Cloudflare Dashboard > Workers & Pages > tamma-wiki-site > Settings > Domains & Routes
#   2. Add wiki.tamma.dev (zone: tamma.dev)
#   3. Add wiki.its-done.dev (zone: its-done.dev)
