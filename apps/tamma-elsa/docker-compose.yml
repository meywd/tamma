# Tamma ELSA Workflows - Development Docker Compose
# For local development and testing

version: '3.8'

services:
  elsa-server:
    build:
      context: ./src
      dockerfile: Tamma.ElsaServer/Dockerfile
    ports:
      - '5000:5000'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=tamma;User Id=tamma;Password=${DB_PASSWORD:-tamma_dev_123};
      - Elsa__Identity__SigningKey=${ELSA_SIGNING_KEY:-sufficiently-long-secret-signing-key-for-elsa-jwt-tokens}
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Username=${RABBITMQ_USER:-tamma}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-tamma_dev_123}
      - Logging__LogLevel__Default=Information
      - Elsa__Server__BaseUrl=http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./workflows:/app/workflows
      - ./activities:/app/activities
      - ./data:/app/storage
    networks:
      - tamma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tamma}
      POSTGRES_USER: ${DB_USER:-tamma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tamma_dev_123}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - tamma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamma -d tamma"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Story 28-1 AC2 — one-shot shared-DB bootstrap ───────────────────────
  # Ensures the shared `tamma` database exists before api / elsa-server
  # start. In shared-infra mode this is largely a no-op (postgres creates
  # POSTGRES_DB=tamma itself), but the script is idempotent and forward-
  # compatible with the future tamma_control / tamma_global_elsa split —
  # set TAMMA_CONTROL_DB / TAMMA_GLOBAL_ELSA_DB to point it at real split
  # DBs. Migrations themselves are applied by the apps at boot
  # (tamma-api → Database.Migrate(); elsa-server → ef.RunMigrations=true),
  # so this service only guarantees the target databases exist. Runs once
  # and exits 0; dependents gate on service_completed_successfully.
  db-bootstrap:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${DB_USER:-tamma}
      PGPASSWORD: ${DB_PASSWORD:-tamma_dev_123}
      TAMMA_CONTROL_DB: ${DB_NAME:-tamma}
      TAMMA_GLOBAL_ELSA_DB: ${TAMMA_GLOBAL_ELSA_DB:-${DB_NAME:-tamma}}
    entrypoint: ['/bin/sh', '-c', '/scripts/db/bootstrap-shared-dbs.sh']
    volumes:
      - ../../scripts/db:/scripts/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tamma-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tamma}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tamma_dev_123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tamma-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  tamma-api:
    build:
      context: ./src/Tamma.Api
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ELSA_SERVER_URL=http://elsa-server:5000
      - DATABASE_URL=postgresql://${DB_USER:-tamma}:${DB_PASSWORD:-tamma_dev_123}@postgres:5432/${DB_NAME:-tamma}
      # Phase-3 dual connection strings. TammaDb = admin / migrations /
      # background services; TammaAppDb = per-request endpoints connecting
      # as the tamma_app role so RLS policies enforce isolation. The
      # Phase-2 migration creates tamma_app with password 'changeme';
      # rotate it via `ALTER ROLE tamma_app WITH PASSWORD ...` and wire
      # the rotated value via TAMMA_APP_DB_PASSWORD below. Until then
      # TammaAppDb falls back to TammaDb with a warning.
      #
      # Story 28-12 AC1+AC2 — dev mirrors the prod three-role shape so the
      # `ConnectionStrings:TammaAppDb is not configured` warning goes away
      # and dev matches prod. Dev keeps a single underlying Postgres role
      # (the tamma_app / tamma_provisioner roles only exist after
      # scripts/db/postgres-roles.sql runs), so the startup current_user
      # role check (DbRoleLeastPrivilegeCheck) is a WARNING here, never a
      # hard fail — that gating lives in ASPNETCORE_ENVIRONMENT=Development.
      # Provisioner is slotted for parity; the API never reads it (it
      # belongs to the provisioning workflow on the elsa-server host).
      - ConnectionStrings__TammaDb=Server=postgres;Port=5432;Database=${DB_NAME:-tamma};User Id=${DB_USER:-tamma};Password=${DB_PASSWORD:-tamma_dev_123};
      - ConnectionStrings__TammaAppDb=Server=postgres;Port=5432;Database=${DB_NAME:-tamma};User Id=${TAMMA_APP_DB_USER:-tamma_app};Password=${TAMMA_APP_DB_PASSWORD:-changeme};
      - ConnectionStrings__Provisioner=Server=postgres;Port=5432;Database=${DB_NAME:-tamma};User Id=${TAMMA_PROVISIONER_DB_USER:-tamma_provisioner};Password=${TAMMA_PROVISIONER_DB_PASSWORD:-changeme};
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      elsa-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - tamma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tamma-dashboard:
    build:
      context: ./src/Tamma.Dashboard
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
    environment:
      - NODE_ENV=development
      - API_URL=http://tamma-api:3000
    depends_on:
      - tamma-api
    networks:
      - tamma-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  tamma-network:
    driver: bridge
