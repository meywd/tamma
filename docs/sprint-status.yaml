  epic-44: contexted   # Native Work Tracking — the mutable system of record (added 2026-07-25)
  # NEW FEATURE. Framing from the survey, not the brief: Tamma PLANS work in three places and TRACKS it
  # in none. (1) docs/sprint-status.yaml — this file — declares tracking_system: file-system and has ZERO
  # programmatic readers (verified by grep across apps/ and packages/). (2) Customer work is a GitHub issue
  # with no local copy anywhere. (3) DecompositionTask/PlanTask are work items in every respect except
  # identity — they live inside a JSONB document body with no row, no status and no assignee.
  # KEY ARCHITECTURAL FIND: DocumentInstance.IssueId is a `string` (DocumentInstance.cs:37), DCB tags.issueId
  # is JSONB, TaskRef.IssueId is string? — nothing constrains it to a GitHub number. So a native work item
  # minting its own key (TAM-142) into that namespace INHERITS THE ENTIRE EPIC 39 SPINE unchanged (document
  # store, lineage, re-entry, escalation, decision inbox, replay) with zero adapter. That is D2 and it costs
  # nothing.
  # EXTERNAL PLATFORMS (D3): native-only source of truth, one-way GitHub import, opt-in comment/label
  # outbound. NO SYNC — the code forces it: IGitPlatformClient has 12 methods and ZERO issue CRUD,
  # Models/Issue.cs is dead code (never returned, never constructed), PlatformKind declares 6 members with no
  # plain-Git value, Bitbucket and Azure DevOps have no class, and there are ZERO production IWebhookHandler
  # implementations (issue webhooks are verified, deduped, categorized and dispatched to nothing).
  # RESIDENCY (D5): tenant schema — and this epic builds the migrate-all-provisioned-tenants sweep Epic 43
  # dodged by going control-plane. MigrateTenantAppAsync has exactly two production call sites, both
  # creation-only. EfTenantDbMigrator is already idempotent, so the fix is ~40 lines of caller.
  # NAMING: every obvious noun is taken (Task → TaskRef/PlanTask/QueuedTask/TaskKind//api/tasks/reserved
  # TASK.*; Story → the live stories table; Issue → the dead record; Cycle → CycleEvents). Hence WorkItem /
  # Iteration / Project in Tamma.Core.Tracking.
  44-0-tracker-core: done                                    # IMPLEMENTED 2026-07-28 (PR #506): Tamma.Core/Tracking/ — 4 kinds, 8 statuses + no-default Category() switch, hierarchy invariants (depth 6, task-under-epic regression), WorkItemRef + key history, base-62 Rank (10k-insertion property tests), priority/estimate/relations. 81 tests (77 + 4 review-round rank tests). Conformance-reviewed 2026-07-28: all 16 ACs verified done.
  # REWORKED 2026-07-25 after comparing against Linear's published GraphQL schema
  # (.dev/findings/linear-comparison-against-story-44-0.md). The (parentKind, childKind) matrix is
  # DELETED: it had only THREE distinct rows — Story/Bug/Spike interchangeable, Task/Chore
  # interchangeable — so WorkItemKind was a 3-member LEVEL enum wearing a 6-member KIND enum's
  # clothes. Worse, it forbade shapes the repo already produces: Epic → Story → DecompositionTask →
  # PlanTask is depth 4 against the old MaxDepth 3, pre-foreclosing the epic's own named v2. Replaced
  # by structural invariants (no cycles, MaxDepth 6, Epic-not-under-non-Epic). WorkItemKind drops to
  # 4 members (bug/chore deleted — TriageIssueType already carries both, a two-member collision that
  # was flagged nowhere). WorkItemStatus gains `triage` (8 members) plus a Category() switch with no
  # default arm, so a new status without a category is a COMPILE error rather than a set-literal
  # drift across five stories. Key frozen at creation + PreviousKeys (the key is the DCB join key and
  # event tags are append-only, so re-minting on a project move silently orphans lineage). Priority
  # nullable ("the agent didn't prioritise this" ≠ "normal"). Rank.Last() deleted — a fixed sentinel
  # made two consecutive appends collide.
  44-1-storage-and-tenant-migration-sweep: done              # Repositories + THE MIGRATE-ALL-PROVISIONED-TENANTS SWEEP (no startup sweep exists today; a new tenant migration never reaches existing tenants). [P0] 6d DONE 2026-07-29: landed in this wave; adversarial + conformance review passed (CONFORMS) — sweep-endpoint hygiene remains an open follow-up; the endpoint's HTTP authorization test landed in this wave (TenantMigrationEndpointAuthTests).
  44-2-work-item-and-project-api: done                       # API, RBAC, tracker_preferences, Epic 43 catalog descriptors. NOTE: work items are CONTENT not configuration — schema-per-tenant already isolates them, so NO principal XOR on work_items; the XOR is used in its strong form on tracker_preferences. [P0] 5d DONE 2026-07-29: landed in wave 4; adversarial review BLOCKED on two defects proved by execution, both fixed, then conformance CONFORMS-WITH-EDITS (applied). (1) A tenant member could irreversibly hard-delete ANY work item — no ownership check, no events, and the visibility degradation shows every member every item, so the loss was unrecoverable, unaudited and undiscoverable; DELETE now requires TrackerManage and the comments no longer claim ownership scoping that was never implemented. (2) The concurrency guarantee was FALSE for projects and preferences (no concurrency token; two writers with the same If-Match both won) — tokens added and the precondition plumbed into the UPDATE itself. Conformance then found DELETE /api/tracker/preferences accepted no If-Match at all while the contract test claimed a handler physically could not forget it; fixed. CONSTRAINT ON 44-3: the (Rank, Key) keyset rests on ranks being unique within a project, which nothing enforces — duplicate ranks are accepted today (pinned), and the compound failure needs a rekey route 44-3 owns.
  44-3-hierarchy-ranking-and-backlog-apply-seam: drafted     # Hierarchy, ranking, and the BacklogOrdering apply seam (41-3 produces the immutable document; 44 owns the mutable record). [P0] 4d
  44-4-iterations-and-board-projection: drafted              # Iterations, board read projection, SprintPlan apply seam. D9 implements the correct behaviour for 41-6 AC3 and asserts NO TASK.* event — see the 41-6 narrowing note below. [P0] 4d
  44-5-dcb-events-and-name-drift-ratchet: drafted            # Events + THE EVENT-NAME DRIFT RATCHET THE REPO HAS NEVER HAD — no test anywhere enforces AGGREGATE.ACTION.STATUS across ~300 constants. [P0] 4d
  44-6-tracker-ui: drafted                                   # UI in packages/dashboard + turning on the 449 dashboard tests that DO NOT RUN IN CI (vitest.config.ts:62 excludes them; no workflow has the filter line) and typechecking both dashboards. WEAKEST ESTIMATE IN THE EPIC. Shares GroupedTable + RowToggle with 43-7 — coordination gate in both directions. [P0] 9d
  44-7-loop-integration-and-intake-fix: drafted              # The story that makes the tracker matter. Owns the issueId join. NOTE: its commit-1 intake bug (SelectWorkItemActivity/FetchUntriagedItemsActivity deserializing List<WorkItem> from a { issues, total } object) WAS ALREADY FIXED ahead of this story — see .dev/bugs/engine-issues-intake-silently-returned-nothing.md. [P0] 5d
  44-8-external-link: drafted                                # GitHub import, ExternalRef, opt-in outbound. [P1] 4d
  44-9-dogfood-generated-sprint-status: drafted              # sprint-status.yaml becomes GENERATED from the tracker. Cancelled if the PO answers "customers-first" to open question 2. [P2] 4d
  epic-44-retrospective: optional
  # ── Cross-epic notes filed by the Epic 44 survey ───────────────────────────────────────────────
