  epic-45: contexted   # Ship the customer application — packages/dashboard-user from built to reachable (added 2026-07-27)
  # NOT A NEW FEATURE. The SaaS customer app already EXISTS — 3,661 lines across 25 files, 20 test files,
  # 103 passing tests, built 2–4 July 2026 under Epic 34-9. It has NEVER been deployed. Its complete wiring
  # outside its own directory is THREE LINES: ci.yml:49-50 (its tests), vitest.config.ts:64 (a deliberate
  # exclusion), eslint.config.js:75-76 (the no-raw-fetch rule). No Dockerfile, no compose service in any of
  # the four compose files, no nginx server block, no entry in docker-publish.yml / deploy.yml /
  # docker-smoke-test.yml, no e2e spec, no hostname. `dash.tamma.dev` appears ZERO times under docker/,
  # .github/ or docs/architecture/ — despite being the app's own package.json:4 description AND the hardcoded
  # default at GitHubEndpoints.cs:25.
  #
  # AUDIT VERDICT (2026-07-27, against the working tree): MOSTLY FINISHED, and NOT deployment-only.
  # What is finished: all 25 HTTP routes the app calls EXIST in Program.cs and are reachable (auth :1838-1859,
  # tenant alerts/channels :2428-2445, dashboard :2396-2400, onboarding :2523-2528, pricing :2265-2283).
  # No stubs, no TODOs, no placeholder pages. vite build clean. GET /api/pricing/estimate really does strip
  # cost-basis and margin (PricingEndpoints.cs:90-102) — the 34-5 leak rule holds.
  #
  # CORRECTION TO THE RECORD: .dev/findings/dashboard-user-is-the-unshipped-saas-customer-app.md:32-34 claims
  # this app's tests do not run. THAT IS BACKWARDS. ci.yml:49-50 IS the filter line and the tests pass (20
  # files / 103 tests). The package with excluded-and-never-run tests is packages/dashboard — the DEPLOYED
  # ADMIN app, ~449 tests, excluded at vitest.config.ts:60 with NO filter line anywhere. That is 44-6's
  # finding and the customer app inherited the blame. Story 45-0 makes the correction permanent.
  #
  # WHAT IS ACTUALLY UNFINISHED — the reason this is not a deployment-only epic:
  # (1) THE API EMAILS SIX URLS INTO THIS APP AND IT IMPLEMENTS NONE OF THEM. /verify?token=
  #     (AuthEndpoints.cs:31-33 — the app has /verify-email, one word off), /reset-password?token=
  #     (:36-39, NO PAGE), /invites/accept?token= (OrgEndpoints.cs:361-362, NO PAGE),
  #     /invites/pending?inviteId= (:501-502, NO PAGE), /onboarding/success and /onboarding/error
  #     (GitHubEndpoints.cs:23-24, exist in the ADMIN app only). App.tsx has NO catch-all, so all six render
  #     a blank pane — no 404, no error. A customer cannot verify their email even after deployment.
  # (2) Dashboard:Url is ONE value driving all six links AND the single-origin CORS list
  #     (Program.cs:1169-1177), and it is set to https://app.tamma.dev (docker-compose.yml:257) — the
  #     oauth2-proxy-gated admin console. Verification emails today land on a GitHub OAuth wall.
  # (3) Four dead nav links (AppLayout.tsx:24,27,33 → /repos /runs /settings; DashboardHome.tsx:64 →
  #     /onboarding). All four are copies of packages/dashboard/src/router.tsx routes. Aspirational, not typos.
  # (4) A CONTRACT THE TESTS CERTIFY AS CORRECT WHILE IT IS WRONG. UpgradePlanModal.tsx:171-172 reads
  #     resp.violations (string[]); the server sends `warnings` as {metricKey,currentUsage,newLimit}[]
  #     (AdminTenantDtos.cs:135-148). UpgradePlanModal.test.tsx:160 MOCKS THE FIELD THAT DOES NOT EXIST, so
  #     the test passes and the downgrade warning silently renders nothing. Every field on the TS interface
  #     was optional, which is exactly how four mismatches typechecked.
  # (5) ONE BLOCKING TYPE ERROR (TenantAlertFeed.tsx:63, exactOptionalPropertyTypes) that nothing would
  #     catch: root package.json:24 typechecks five packages and NEITHER dashboard; no workflow typechecks
  #     either; vite build does not typecheck. Also tsconfig.json:51 excludes packages/dashboard but NOT
  #     dashboard-user, so ESLint's type-aware parser points at a project with no DOM lib and no jsx setting.
  # (6) No error boundary (main.tsx:11-12 renders <App /> bare). (7) No public/ — no favicon, no robots.txt.
  #
  # NOT GAPS (checked): zero version skew with the admin app; the VITE_API_URL vs VITE_API_BASE_URL name
  # divergence is cosmetic (NEITHER is set anywhere in the repo — both apps work via same-origin /api/ through
  # their own nginx); the richer ApiClient (typed errors + refresh-on-401, which the admin app lacks entirely)
  # is a SANCTIONED per-package divergence.
  #
  # UNBLOCKS THREE THINGS THAT DO NOT SAY SO IN THEIR OWN PLANS: Story 39-19 (orchestrator chat targets this
  # app), Story 44-6 (tracker UI is planned into packages/dashboard *because* this is undeployed — a
  # customer-facing board in the console customers cannot reach; Epic 44 README open question 1, answered
  # here), and Epic 34-9's own deliverable (plan management no customer can open).
  45-0-typecheck-guard-rail: done                            # IMPLEMENTED (PR #505 + #506): CI steps + tsc fix landed in #505; root tsconfig exclude + regression pins in #506.
  45-1-subscribe-contract-and-patch-refresh: done            # IMPLEMENTED 2026-07-28 (PR #506): SubscribeResponse rewritten to the real PlanAssignmentResponse (metricKey arrives PascalCase — normalizer folds it); modal gained a post-submit confirmation state (the old flow unmounted before warnings could render); ApiClient.patch with refresh-on-401.
