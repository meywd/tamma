  #   autonomyLevel and its four task types are acceptance_decision|review|approval|clarification, each a
  #   suspended 39-8 bookmark, with NO table. Disjoint nouns sharing a word. Epic 44 uses /work, never /tasks.
  # 39-20 owns the SET of eligible people; Epic 44 owns the CHOICE and persists it. STANDING WARNING: the
