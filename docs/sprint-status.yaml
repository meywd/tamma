  epic-43: contexted   # The Action Catalog — one governed list of everything Tamma can do (added 2026-07-25)
  # NEW FEATURE, not a gap fix: the autonomy dial (AcceptanceRules.AutonomyLevel, 70-100) is stored,
  # validated, defaulted and displayed, and nothing reads it to decide anything — the consuming layer
  # was never built. Consequential capability is spread across 16 unrelated vocabularies (80 AgentActions,
  # 7 tool classes, 218 Elsa activities, ~205 mutating routes, 53 SensitiveActionCatalog codes, 14 git
  # subcommands, two non-overlapping shell denylists...), only two of which have drift protection. So the
  # catalog is a NEW union vocabulary layered over them, not a re-presentation of an existing list.
  # Decisions: .dev/decisions/epic-43-action-catalog-design.md. D1 v1 ENFORCES with behaviour-preserving
  # defaults; D2 unclassified is allowed at runtime but unmergeable in CI (Roslyn analyzer rejected —
  # 79/200 mutating Map* calls have no fluent chain, ~40% structural miss rate); D3 no lower bound in the
  # model, [70,100] as ONE named constant. Supersedes 39-23.
  43-0-prerequisite-fixes-and-dead-code: drafted             # Fixes a LIVE bug: RulesEditDialog omits acceptorRequirement from its PUT body and the API defaults it, so every admin save silently resets design from human back to any. Also deletes ResolveToolsActivity (zero callers, a third dead tool vocabulary) and resolves GetAcceptanceRulesTool (a tool the registry cannot see). Ships standalone. [P1]
  43-1-autonomy-dial-one-constant: drafted                   # AutonomyDial{Min,Max,Default,AlwaysHuman} in one place, published over the wire so the UI binds instead of hardcoding; fixes the 8 hardcode sites incl. the corrupt-row test vector and two silent coverage loops; 13-file doc pass. Ships standalone and is valuable even if the rest slips. [P0]
  43-2-catalog-core: drafted                                 # Tamma.Core/Actions/: ActionNamespace, ActionKey (composite, NOT a flat enum — a flat one would copy all 80 AgentAction wire strings into a second vocabulary), ActionRisk, the 4 new [Wire] enums, ActionDescriptor, fail-loud index. [P0]
  43-3-groups-and-behaviour-preserving-defaults: drafted     # The 15-member ActionGroup partition + assignment of all ~153 members + DefaultMinAutonomy set so day one reproduces today exactly. LARGEST JUDGMENT CALL in the epic — a bad partition is a bad safety policy and no test catches a wrong-but-consistent one. [P0]
  43-4-tool-vocabulary-reconciliation: drafted               # The startup validator that has never existed. NOTE: reconciling the three disagreeing tool vocabularies (registry file_read/file_write/shell_execute vs advertised Read/Write/Bash vs a dead built-in map) is a PRIVILEGE EXPANSION, not a cleanup — tools advertised under Claude-Code names currently cannot execute at all. [P0]
  43-5-storage-principal-resolution-resolver-audit: drafted  # action_assignments + action_authorizations, CONTROL-PLANE resident (tenant residency fails 3 ways, decisively: a new tenant migration never reaches already-provisioned tenants) and DELIBERATELY EXCLUDED from the destructive startup DROP list. Principal resolution is mandatory — the engine service principal carries no user id and a nullable header-sourced tenant id. [P0]
  43-6-admin-api-and-rbac: drafted                           # actions:manage in all THREE places incl. the Development-permissive array; single-field PUTs (not defaulted bodies — that is the 43-0 bug class); server-computed automatedAtLevel/editable/enforcementSites. [P0]
  43-7-admin-ui: drafted                                     # Three new React primitives with NO in-repo precedent (RowToggle, GroupedTable, DimmedRow+tooltip — the dimmed-row treatment exists only in Blazor). LEAST RELIABLE ESTIMATE IN THE PLAN. [P0]
  43-8-drift-harnesses: drafted                              # Bidirectional reflection sweeps over routes (incl. attribute-routed controllers and hub endpoints, invisible to syntax analysis), mediation-client mutating methods, background actors (incl. the factory-overload registration where ImplementationType is null), and activities missing [Activity]. Shrink-only ratchet on the ungoverned backlog. [P0]
  43-9-seams-enforcement-and-authorization-ledger: drafted   # Five seams. Seam A (llm-call) is OBSERVE-ONLY PERMANENTLY — a requires-human there reaches a dispatch whose caller has no human route in 44 of 45 workflows. Seam B sits post-sanitization and pre-fork, NOT nested in the optional validator block. Seam C is an endpoint filter (tenant context is unset during policy evaluation) returning 409 never 202 (202 is already a success code on the mediation client). Seam D can only deny — a sweeper cannot suspend. Seam E reaches the gate over HTTP and is OR'd into the deploy approval, never replacing it. [P0]
