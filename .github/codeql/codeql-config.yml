name: "Tamma CodeQL config"

query-filters:
  - exclude:
      id: js/missing-rate-limiting
  # js/regex-injection:
  # The only call site is validatePatterns() in
  # packages/api/src/services/sanitization-store.ts, which compiles
  # admin-supplied regex patterns used to extend injection/command
  # filters. Defence in depth:
  #   (1) Endpoint is gated by requirePermission('settings:manage')
  #       (owner role only).
  #   (2) Pattern length is capped at 256 characters.
  #   (3) Nested-quantifier patterns (the canonical ReDoS shape
  #       `(...[*+?]...)[*+?]`) are rejected before compilation.
  # See sanitization-store.ts for the implementation and
  # sanitization-store.test.ts for regression tests.
  - exclude:
      id: js/regex-injection
  # cs/cleartext-storage-of-sensitive-information:
  # ~150+ production log sites across apps/tamma-elsa/src use Serilog
  # structured-logging placeholders {TenantId}, {UserId}, {OrgId},
  # {KeyId}, {OwnerId} for distributed tracing (audit 2026-04-25:
  # 144 single-line matches via grep; multi-line calls add more).
  # CodeQL's heuristic treats any identifier whose name contains
  # "id"/"key"/"owner" near a logging sink as cleartext-storage of
  # credentials, which produces a corresponding flood of false
  # positives because the values are opaque GUIDs, not secrets.
  # Compensating control: literal credential leaks (sk_live_, ghp_,
  # cranl_sk_, AWS keys, etc.) are caught by the forbidden-symbols
  # guard at ci/check-forbidden-symbols.sh, run on every CI build.
  # Re-evaluate this exclusion if the rule starts catching real
  # credential leakage elsewhere in the codebase, or if Serilog
  # placeholder names are reworked away from the {Id}/{Key} pattern.
  - exclude:
      id: cs/cleartext-storage-of-sensitive-information
  # cs/exposure-of-sensitive-information:
  # The same Serilog structured-logging audit-trail pattern as the
  # cleartext-storage exclusion above, applied to a different CodeQL
  # rule that also flags identifier-bearing log fields. PR #329
  # introduced three sites (AdminEndpoints USER.ROLE_CHANGED.SUCCESS
  # @ line 222, AdminEndpoints USER.DELETED.SUCCESS @ line 309,
  # AuthEndpoints USER.BOOTSTRAP_ADMIN.SUCCESS @ line 189) where the
  # actor's email is intentionally written to the audit log so the
  # row is searchable by a human investigator: "who promoted X?",
  # "who deleted Y?". Email is the established account identifier
  # for accountability, NOT a credential. Compensating controls:
  #   (1) log access is restricted to the platform-admin surface
  #       (Pino/Serilog sinks ship to the central log system, which
  #       enforces RBAC).
  #   (2) literal credential leaks (sk_live_, ghp_, cranl_sk_, AWS
  #       keys, etc.) remain caught by the forbidden-symbols guard
  #       at ci/check-forbidden-symbols.sh on every CI build.
  # Re-evaluate this exclusion if the rule starts catching real PII
  # or credential leakage elsewhere in the codebase.
  - exclude:
      id: cs/exposure-of-sensitive-information
