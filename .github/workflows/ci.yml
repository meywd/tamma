name: CI

on:
  push:
    branches: [main, feat/wave-a, feat/engine-mvp, feat/deployment]
  pull_request:
    branches: [main, feat/wave-a]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm vitest run

      - name: Run dashboard-user tests (jsdom + jest-dom; own vitest config)
        run: pnpm --filter @tamma/dashboard-user test

      - name: Verify CLI bundle builds
        run: pnpm --filter @tamma/cli run build:bundle

      - name: Shellcheck install script
        run: shellcheck install.sh

  integration-tests:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Postgres image (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 60
          command: docker pull pgvector/pgvector:pg16

      - name: Start Postgres (pgvector)
        run: |
          docker run -d --name postgres-test \
            -e POSTGRES_USER=tamma_test \
            -e POSTGRES_PASSWORD=tamma_test \
            -e POSTGRES_DB=tamma_test \
            -p 5433:5432 \
            --tmpfs /var/lib/postgresql/data \
            --health-cmd "pg_isready -U tamma_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 5 \
            pgvector/pgvector:pg16

      - name: Start ChromaDB
        run: |
          docker run -d --name chromadb-test \
            -e ANONYMIZED_TELEMETRY=false \
            -e IS_PERSISTENT=false \
            -p 8000:8000 \
            chromadb/chroma:0.6.3

      - name: Wait for Postgres healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' postgres-test 2>/dev/null || echo 'starting')
            echo "Check $i/30: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Postgres failed to become healthy" && docker logs postgres-test && exit 1

      - name: Wait for ChromaDB healthy
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/v1/heartbeat > /dev/null 2>&1; then
              echo "ChromaDB is healthy"
              exit 0
            fi
            echo "Check $i/15: waiting..."
            sleep 2
          done
          echo "ChromaDB failed to become healthy" && docker logs chromadb-test && exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (builds project references)
        run: pnpm typecheck

      - name: Run integration tests
        env:
          INTEGRATION_TEST_PG: 'true'
          PG_TEST_HOST: localhost
          PG_TEST_PORT: '5433'
          PG_TEST_USER: tamma_test
          PG_TEST_PASSWORD: tamma_test
          PG_TEST_DB: tamma_test
          PGVECTOR_TEST_CONNECTION_STRING: 'postgresql://tamma_test:tamma_test@localhost:5433/tamma_test'
          CHROMADB_TEST_URL: 'http://localhost:8000'
        run: npx vitest run --config vitest.integration.config.ts

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (builds project references)
        run: pnpm typecheck

      - name: Run E2E tests
        run: npx vitest run --config vitest.e2e.config.ts --passWithNoTests

  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/tamma-elsa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tamma.sln

      - name: Build
        run: dotnet build Tamma.sln --no-restore -c Release

      - name: Test
        run: dotnet test Tamma.sln --no-build -c Release --verbosity normal
