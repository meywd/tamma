# =============================================================================
# E2E Tests — Post-Deploy Verification
#
# Runs Playwright E2E tests against the deployed Tamma services.
# Triggers:
#   - After docker-publish deploy succeeds (workflow_run)
#   - Manual dispatch with configurable URLs
# =============================================================================

name: E2E Deploy Tests

on:
  workflow_run:
    workflows: ["Build & Publish Docker Images"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      app_url:
        description: 'Admin dashboard URL (admin.tamma.dev)'
        default: 'https://admin.tamma.dev'
        type: string
      api_url:
        description: 'API URL (api.tamma.dev)'
        default: 'https://api.tamma.dev'
        type: string
      elsa_url:
        description: 'ELSA Studio URL (elsa.tamma.dev)'
        default: 'https://elsa.tamma.dev'
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run if the triggering workflow succeeded (or if manually dispatched)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the branch that triggered the deploy
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for services to stabilize
        if: github.event_name == 'workflow_run'
        env:
          APP_URL: ${{ inputs.app_url || 'https://admin.tamma.dev' }}
          API_URL: ${{ inputs.api_url || 'https://api.tamma.dev' }}
          ELSA_URL: ${{ inputs.elsa_url || 'https://elsa.tamma.dev' }}
        run: |
          # The layered deploy restarts containers (dashboard/nginx come up LAST),
          # so immediately post-deploy Cloudflare returns 521 for a window. A blind
          # `sleep 30` under-waits and the smoke tests flake on a transient 521.
          # Poll each origin until it responds with a real (< 500) status, up to 5m.
          deadline=$((SECONDS + 300))
          wait_ready() {
            url="$1"
            echo "Waiting for $url ..."
            while :; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
              if [ "$code" -ge 100 ] && [ "$code" -lt 500 ]; then
                echo "  $url -> $code (ready)"; return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::warning::$url still not ready (last=$code) after 5m; running tests anyway to surface the real failure"
                return 0
              fi
              echo "  $url -> $code, retrying in 10s..."; sleep 10
            done
          }
          wait_ready "$APP_URL"
          wait_ready "$API_URL/health"
          wait_ready "$ELSA_URL"

      - name: Run E2E smoke tests
        env:
          E2E_BASE_URL: ${{ inputs.app_url || 'https://admin.tamma.dev' }}
          E2E_API_URL: ${{ inputs.api_url || 'https://api.tamma.dev' }}
          E2E_ELSA_URL: ${{ inputs.elsa_url || 'https://elsa.tamma.dev' }}
          CI: true
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14

      - name: Upload trace files on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: e2e/test-results/**/*.zip
          retention-days: 14

      - name: Summary
        if: always()
        # The three URLs and the job status arrive through env rather than being
        # pasted into the script text: a workflow_dispatch input interpolated
        # straight into a shell command is an injection seam, and env values are
        # never re-parsed as shell.
        env:
          APP_URL: ${{ inputs.app_url || 'https://admin.tamma.dev' }}
          API_URL: ${{ inputs.api_url || 'https://api.tamma.dev' }}
          ELSA_URL: ${{ inputs.elsa_url || 'https://elsa.tamma.dev' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## E2E Test Results"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Dashboard | $APP_URL |"
            echo "| API | $API_URL |"
            echo "| ELSA Studio | $ELSA_URL |"
            echo ""
            if [ "$JOB_STATUS" = "success" ]; then
              echo "All E2E tests passed."
            else
              echo "Some E2E tests failed. Check the uploaded artifacts for screenshots and traces."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
