# =============================================================================
# Tamma Reverse Proxy — nginx configuration
#
# Routing:
#   app.tamma.dev/          → tamma-dashboard (SPA)
#   app.tamma.dev/api/      → tamma-api (Fastify)
#   api.tamma.dev/          → tamma-api (Fastify, for webhooks/machine clients)
#   elsa.tamma.dev/         → elsa-server (ELSA Studio)
#
# Behind Cloudflare (TLS termination on edge).
# =============================================================================

# app.tamma.dev — dashboard + API under /api/
server {
    listen 80;
    server_name app.tamma.dev;

    # API routes — proxy to tamma-api
    location /api/ {
        proxy_pass http://tamma-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoints — disable buffering for streaming
    location ~ ^/api/(engine/events|workflows/.*/events) {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Dashboard SPA — everything else
    location / {
        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# api.tamma.dev — API only (for webhooks, machine clients, GitHub App callback)
server {
    listen 80;
    server_name api.tamma.dev;

    # GitHub webhook endpoint — higher limits
    location /api/github/webhooks {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # All API requests
    location / {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# elsa.tamma.dev — ELSA Studio
server {
    listen 80;
    server_name elsa.tamma.dev;

    location / {
        proxy_pass http://elsa-server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Default: serve dashboard + API on bare IP or unknown host (for testing)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://tamma-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
