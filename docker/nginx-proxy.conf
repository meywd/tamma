# =============================================================================
# Tamma Reverse Proxy — nginx configuration
#
# Listens on 443 (TLS with Cloudflare origin cert) and 80 (redirect to HTTPS).
#
# Routing:
#   app.tamma.dev/        → dashboard (via oauth2-proxy, Epic 16)
#   app.tamma.dev/api/    → tamma-api
#   api.tamma.dev/        → tamma-api (webhooks/machine clients)
#   elsa.tamma.dev/       → elsa-studio (via oauth2-proxy, admin/owner only)
#   logs.tamma.dev/       → opensearch-dashboards (via oauth2-proxy, admin/owner only)
#   Bare IP               → dashboard + /api/
#
# Auth: oauth2-proxy provides unified GitHub OAuth across all dashboards.
#       See Epic 16 stories for implementation details.
# =============================================================================

# Redirect HTTP → HTTPS for named hosts
server {
    listen 80;
    server_name app.tamma.dev api.tamma.dev elsa.tamma.dev logs.tamma.dev;
    return 301 https://$host$request_uri;
}

# Bare IP on port 80 — dashboard + API (for testing without DNS)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://tamma-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS settings (shared)
ssl_certificate /etc/nginx/certs/origin-cert.pem;
ssl_certificate_key /etc/nginx/certs/origin-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;

# app.tamma.dev — dashboard + /api/
server {
    listen 443 ssl;
    server_name app.tamma.dev;

    location /api/ {
        proxy_pass http://tamma-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/(engine/events|workflows/.*/events) {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# api.tamma.dev — API only (webhooks, machine clients)
server {
    listen 443 ssl;
    server_name api.tamma.dev;

    location /api/github/webhooks {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# elsa.tamma.dev — ELSA Studio + Server API
server {
    listen 443 ssl;
    server_name elsa.tamma.dev;

    # ELSA Server API — proxied so browser can reach it
    location /elsa/api/ {
        proxy_pass http://elsa-server:5000/elsa/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ELSA Studio UI (Blazor WASM on port 8080)
    location / {
        proxy_pass http://elsa-studio:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# logs.tamma.dev — OpenSearch Dashboards
# Auth: oauth2-proxy (Epic 16, Story 16.1) + RBAC admin/owner only (Story 16.5)
# Depends on: opensearch-dashboards service (Epic 15, Story 15.1)
server {
    listen 443 ssl;
    server_name logs.tamma.dev;

    location / {
        proxy_pass http://opensearch-dashboards:5601;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
