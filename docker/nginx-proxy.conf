# =============================================================================
# Tamma Reverse Proxy — nginx configuration
#
# Routes traffic based on hostname:
#   api.tamma.dev   → tamma-api (port 3100)
#   app.tamma.dev   → tamma-dashboard (port 3001)
#   elsa.tamma.dev  → elsa-server (port 5000) — requires auth cookie
#
# Sits behind Cloudflare which handles public TLS termination.
# =============================================================================

# API: api.tamma.dev
server {
    listen 80;
    server_name api.tamma.dev;

    # GitHub webhook endpoint — needs raw body, higher limits
    location /api/github/webhooks {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # SSE endpoints — disable buffering for streaming
    location ~ ^/api/(engine/events|workflows/.*/events) {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # All other API requests
    location / {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Dashboard: app.tamma.dev
server {
    listen 80;
    server_name app.tamma.dev;

    # Auth check — verify tamma_session cookie exists via API
    # If missing, redirect to GitHub OAuth login
    location = /_auth_check {
        internal;
        proxy_pass http://tamma-api:3100/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Login redirect (no auth required)
    location = /login {
        return 302 https://api.tamma.dev/api/auth/github;
    }

    # Dashboard — requires auth
    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @login_redirect {
        return 302 https://api.tamma.dev/api/auth/github;
    }
}

# ELSA Studio: elsa.tamma.dev — requires auth cookie
server {
    listen 80;
    server_name elsa.tamma.dev;

    # Auth check — same as dashboard
    location = /_auth_check {
        internal;
        proxy_pass http://tamma-api:3100/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        proxy_pass http://elsa-server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @login_redirect {
        return 302 https://api.tamma.dev/api/auth/github;
    }
}

# Default: reject unknown hosts
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
