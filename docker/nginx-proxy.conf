# =============================================================================
# Tamma Reverse Proxy — nginx configuration
#
# Listens on 443 (TLS with Cloudflare origin cert) and 80 (redirect to HTTPS).
#
# Routing:
#   app.tamma.dev/        -> dashboard (oauth2-proxy protected)
#   app.tamma.dev/api/    -> tamma-api (JWT auth, no oauth2-proxy)
#   api.tamma.dev/        -> tamma-api (webhooks/machine clients, no oauth2-proxy)
#   elsa.tamma.dev/       -> elsa-studio (oauth2-proxy protected)
#   logs.tamma.dev/       -> opensearch-dashboards (oauth2-proxy protected)
#   Bare IP               -> dashboard + /api/
#
# Auth: oauth2-proxy handles GitHub OAuth login for browser-facing routes
#       (dashboard, ELSA Studio, Logs). API routes use JWT auth directly.
#       Unauthenticated users are redirected to /oauth2/sign_in (GitHub login).
#       The oauth2-proxy cookie (_oauth2_proxy) is shared across *.tamma.dev.
#
# Optional services: opensearch-dashboards may not be running.
#       We use variables for proxy_pass to defer DNS resolution to request time,
#       and Docker's embedded DNS (127.0.0.11) as resolver.
#
# Nav: Unified navigation bar injected via sub_filter into third-party
#      dashboards (Story 16.4). Assets served from /nav-header/ mount.
# =============================================================================

# Use Docker's embedded DNS resolver so variable-based proxy_pass works.
# "valid=30s" caches DNS for 30s; services that restart get re-resolved.
resolver 127.0.0.11 valid=30s ipv6=off;

# Redirect HTTP -> HTTPS for named hosts
server {
    listen 80;
    server_name app.tamma.dev api.tamma.dev elsa.tamma.dev logs.tamma.dev;
    return 301 https://$host$request_uri;
}

# Bare IP on port 80 — dashboard + API (for testing without DNS)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://tamma-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS settings (shared)
ssl_certificate /etc/nginx/certs/origin-cert.pem;
ssl_certificate_key /etc/nginx/certs/origin-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;

# =============================================================================
# app.tamma.dev — dashboard + /api/
# =============================================================================
server {
    listen 443 ssl;
    server_name app.tamma.dev;

    # ----- Shared nav bar assets (Story 16.4) -----
    # Served from the mounted nav-header/ directory with CORS for subdomains.
    location = /tamma-nav.html {
        alias /etc/nginx/nav-header/tamma-nav.html;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET";
        default_type text/html;
    }

    location = /tamma-nav.js {
        alias /etc/nginx/nav-header/tamma-nav.js;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET";
        default_type application/javascript;
    }

    # ----- OAuth2 Proxy endpoints -----
    # Main oauth2 paths (sign_in, sign_out, callback, etc.)
    # Variable proxy_pass defers DNS resolution so nginx starts without oauth2-proxy.
    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Internal auth_request endpoint (used by nginx to validate sessions)
    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream/oauth2/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ----- API routes: JWT-based auth (no oauth2-proxy gate) -----
    location /api/ {
        proxy_pass http://tamma-api:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSE endpoints (long-lived connections, JWT-protected — no oauth2-proxy)
    location ~ ^/api/(engine/events|workflows/.*/events) {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ----- Dashboard: protected by oauth2-proxy -----
    # If oauth2-proxy is down (502), serve without auth (graceful degradation).
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        error_page 502 = @dashboard_no_auth;

        # Pass authenticated user info upstream
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;

        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ----- Fallback: serve dashboard without auth when oauth2-proxy is down -----
    location @dashboard_no_auth {
        proxy_pass http://tamma-dashboard:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# =============================================================================
# api.tamma.dev — API only (webhooks, machine clients) — no proxy gate
# =============================================================================
server {
    listen 443 ssl;
    server_name api.tamma.dev;

    location /api/github/webhooks {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://tamma-api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# =============================================================================
# elsa.tamma.dev — ELSA Studio + Server API (protected by oauth2-proxy)
#
# Auth flow: nginx auth_request sends a subrequest to oauth2-proxy which
# validates the user's GitHub OAuth session. Unauthenticated users are
# redirected to /oauth2/sign_in (GitHub login).
#
# ELSA Server API calls are authenticated via an admin API key injected by
# nginx (ELSA_ADMIN_API_KEY env var), so oauth2-proxy handles user auth
# and nginx injects the service-level credential.
#
# Nav bar: ELSA Studio is our own Blazor WASM app, so the nav script is
# included directly in its index.html (no sub_filter needed).
# =============================================================================
server {
    listen 443 ssl;
    server_name elsa.tamma.dev;

    # ----- OAuth2 Proxy endpoints -----
    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream/oauth2/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ----- ELSA health check: skip auth -----
    location = /health {
        proxy_pass http://elsa-server:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ----- Blazor WASM static assets: skip auth (no secrets here) -----
    # Blazor loads ~100 .wasm/.dat files simultaneously; auth_request on each
    # would hit the rate limit (429) and break the app.
    location /_framework/ {
        set $elsa_studio_upstream http://elsa-studio:80;
        proxy_pass $elsa_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /_content/ {
        set $elsa_studio_upstream http://elsa-studio:80;
        proxy_pass $elsa_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ----- ELSA Server API: protected by oauth2-proxy, API key injected -----
    location /elsa/api/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        error_page 502 = @elsa_api_no_auth;

        # Pass authenticated user info upstream
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;

        # Pass cookies to ELSA server for session-based auth
        proxy_set_header Cookie $http_cookie;

        proxy_pass http://elsa-server:5000/elsa/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ----- Fallback: serve ELSA API without auth when oauth2-proxy is down -----
    location @elsa_api_no_auth {
        proxy_pass http://elsa-server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ----- ELSA Studio UI: protected by oauth2-proxy -----
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        error_page 502 = @elsa_studio_no_auth;

        # Pass authenticated user info upstream
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;

        set $elsa_studio_upstream http://elsa-studio:80;
        proxy_pass $elsa_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ----- Fallback: serve ELSA Studio without auth when oauth2-proxy is down -----
    location @elsa_studio_no_auth {
        set $elsa_studio_upstream http://elsa-studio:80;
        proxy_pass $elsa_studio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# =============================================================================
# logs.tamma.dev — OpenSearch Dashboards (protected by oauth2-proxy)
#
# Auth flow: nginx auth_request sends a subrequest to oauth2-proxy which
# validates the user's GitHub OAuth session. Unauthenticated users are
# redirected to /oauth2/sign_in (GitHub login).
#
# OpenSearch Dashboards is behind the "observability" profile and may not be
# running. All proxy_pass directives use variables for deferred DNS resolution.
#
# Nav bar: OpenSearch Dashboards is a third-party app that cannot be modified.
# We inject the Tamma nav bar via nginx sub_filter, loading the self-injecting
# script from app.tamma.dev (Story 16.4).
# =============================================================================
server {
    listen 443 ssl;
    server_name logs.tamma.dev;

    # ----- OAuth2 Proxy endpoints -----
    location /oauth2/ {
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /oauth2/auth {
        internal;
        set $oauth2_upstream http://oauth2-proxy:4180;
        proxy_pass $oauth2_upstream/oauth2/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # ----- Fallback: return 503 when opensearch-dashboards is unavailable -----
    location @logs_unavailable {
        default_type text/html;
        return 503 '<html><body><h1>Logs Dashboard Unavailable</h1><p>The observability stack is not currently running. Start it with: <code>docker compose --profile observability up -d</code></p></body></html>';
    }

    # ----- OpenSearch Dashboards: protected by oauth2-proxy, nav bar injected -----
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        # If opensearch-dashboards is down, show unavailable page
        error_page 502 503 = @logs_unavailable;

        # Pass authenticated user info upstream
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;

        set $osd_upstream http://opensearch-dashboards:5601;
        proxy_pass $osd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # --- Tamma Nav Bar Injection (Story 16.4) ---
        # Disable upstream compression so sub_filter can operate on the body.
        proxy_set_header Accept-Encoding "";
        # Inject the self-injecting nav script before </head>.
        # sub_filter operates on text/html by default, no need to set sub_filter_types.
        sub_filter '</head>' '<script src="https://app.tamma.dev/tamma-nav.js" defer></script></head>';
        sub_filter_once on;
    }
}
