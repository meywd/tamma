# =============================================================================
# Tamma Platform — Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds resource limits. Single-instance for port-bound services.
# =============================================================================

services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  elsa-server:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tamma-api-dotnet:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  tamma-api:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "3100:3100"

  tamma-engine:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tamma-dashboard:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    ports:
      - "3001:3001"
