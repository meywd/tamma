# =============================================================================
# Tamma Platform — Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds resource limits. Traffic enters via nginx-proxy on port 80.
# Cloudflare handles public TLS termination.
# =============================================================================

services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  chromadb:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  elsa-server:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tamma-api-dotnet:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  tamma-api:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    # No exposed ports — reachable via nginx-proxy only

  tamma-engine:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tamma-dashboard:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    # No exposed ports — reachable via nginx-proxy only

  nginx-proxy:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
