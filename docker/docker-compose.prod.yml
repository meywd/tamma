# =============================================================================
# Tamma Platform — Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds resource limits and restart policies. Traffic enters via nginx-proxy
# on ports 80/443. Cloudflare handles public TLS termination.
#
# Memory budget (without observability profile):
#   PostgreSQL:       2G
#   RabbitMQ:       512M
#   ChromaDB:         1G
#   Ollama:           2G   (nomic-embed-text, local KB/RAG embeddings)
#   elsa-server:      1G
#   tamma-api:        768M  (consolidated C# API)
#   tamma-engine:     1G
#   tamma-dashboard:  256M
#   elsa-studio:      128M
#   nginx-proxy:      128M
#   ─────────────────────
#   Total:          ~8.8G  (leaves ~7.2G for OS, Docker, and headroom)
#
# With observability profile (+opensearch +dashboards):
#   opensearch:       3G
#   opensearch-dashboards: 1.5G
#   opensearch-setup: 128M
#   ─────────────────────
#   Total:         ~11.8G  (leaves ~4.2G for OS and Docker)
# =============================================================================

services:
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  rabbitmq:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  chromadb:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  ollama:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  elsa-server:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tamma-api:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    # No exposed ports — reachable via nginx-proxy only

  tamma-engine:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  tamma-dashboard:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    # No exposed ports — reachable via nginx-proxy only

  elsa-studio:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    # No exposed ports — reachable via nginx-proxy only

  opensearch:
    restart: unless-stopped
    environment:
      # Override heap to fit 16GB VPS (2G heap + ~1G overhead = ~3G total)
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    # In production, do not expose port 9200 — internal only

  opensearch-dashboards:
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=1024"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1536M
    # In production, do not expose port 5601 — accessed via nginx

  opensearch-setup:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  oauth2-proxy:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  nginx-proxy:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
