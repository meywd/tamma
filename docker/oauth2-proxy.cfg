## =============================================================================
## Tamma Platform — oauth2-proxy configuration
##
## Provides unified GitHub OAuth authentication across all *.tamma.dev dashboards.
## nginx uses auth_request to delegate authentication checks to this proxy.
##
## Environment variables override empty fields:
##   OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
## =============================================================================

# Provider
provider = "github"
client_id = ""          # Set via env: OAUTH2_PROXY_CLIENT_ID
client_secret = ""      # Set via env: OAUTH2_PROXY_CLIENT_SECRET

# GitHub scopes — same as existing OAuth flow
scope = "user:email read:org"

# URLs
redirect_url = "https://app.tamma.dev/oauth2/callback"
cookie_domains = [".tamma.dev"]
whitelist_domains = [".tamma.dev"]

# Cookie settings
cookie_name = "_tamma_oauth"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"    # 7 days
cookie_refresh = "1h"     # Refresh session every hour

# Session
cookie_secret = ""        # Set via env: OAUTH2_PROXY_COOKIE_SECRET (32-byte base64)

# Upstream — not used directly (nginx auth_request mode)
upstreams = ["static://202"]

# Headers to pass to upstream
set_xauthrequest = true
set_authorization_header = true
pass_access_token = true
pass_user_headers = true

# Email domains — allow all GitHub users (RBAC handled at app level)
email_domains = ["*"]

# Logging
logging_filename = ""     # Log to stdout
standard_logging = true
request_logging = true
auth_logging = true

# HTTP
http_address = "0.0.0.0:4180"

# Skip auth for health endpoints and webhooks
skip_auth_routes = [
  "^/health$",
  "^/api/health$",
  "^/api/github/webhooks"
]

# Reverse proxy mode (trust X-Forwarded-* headers from nginx)
reverse_proxy = true
real_client_ip_header = "X-Real-IP"
