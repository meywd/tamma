# =============================================================================
# OAuth2 Proxy Configuration — GitHub OAuth Provider
#
# Runs in nginx auth_request mode (static upstream returning 202).
# GitHub OAuth validates user identity; RBAC is handled at the app level.
#
# Environment variables required (set in docker-compose.yml):
#   OAUTH2_PROXY_CLIENT_ID           — GitHub OAuth App client ID
#   OAUTH2_PROXY_CLIENT_SECRET       — GitHub OAuth App client secret
#   OAUTH2_PROXY_COOKIE_SECRET       — 32-byte base64-encoded secret
#
# Generate cookie secret:
#   python3 -c 'import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
# =============================================================================

# ----- Provider -----
provider = "github"
scope = "user:email read:org"

# Allow all GitHub users (RBAC is enforced at the application level)
email_domains = ["*"]

# ----- Listener -----
http_address = "0.0.0.0:4180"

# ----- Upstream -----
# Static 202 response — used with nginx auth_request (no real upstream needed)
upstreams = ["static://202"]

# ----- Auth request headers -----
set_xauthrequest = true
pass_access_token = true
pass_user_headers = true

# ----- Redirect URL -----
# Hostname re-layout (2026-07-28): the admin console (the oauth2-proxy'd
# host) moved from app.tamma.dev to admin.tamma.dev. The GitHub OAuth App's
# "Authorization callback URL" (github.com → Settings → Developer settings)
# MUST match this value exactly, or every login 302s to a GitHub error page.
redirect_url = "https://admin.tamma.dev/oauth2/callback"

# ----- Cookie -----
cookie_name = "_oauth2_proxy"
cookie_domains = [".tamma.dev"]
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "1h"

# ----- Skip auth for health/webhook routes -----
skip_auth_routes = ["^/health$", "^/api/health$", "^/api/github/webhooks"]

# ----- Reverse proxy mode -----
reverse_proxy = true
