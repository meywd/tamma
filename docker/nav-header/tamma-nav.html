<!--
  Tamma Unified Navigation Bar — Self-contained HTML/CSS/JS snippet.
  Token source: docs/stories/epic-16/16-4-unified-navigation-impl-plan.md — keep in sync

  Injected via nginx sub_filter into third-party dashboards (OpenSearch, ELSA Studio)
  or loaded by tamma-nav.js self-injecting script.

  Requirements:
  - No external dependencies
  - Scoped CSS (all selectors under #tamma-nav)
  - Loads user data from /api/auth/me via cross-subdomain cookie
  - Active link highlighting based on hostname
  - Admin link visible only for admin/owner roles
  - Works as static HTML fallback if JS fails (links still render)
  - Accessible: ARIA landmarks, skip link, keyboard navigation
-->
<nav id="tamma-nav" role="navigation" aria-label="Tamma services">
  <style>
    #tamma-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99999;
      height: 48px;
      background: #7B61FF;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }
    #tamma-nav * { box-sizing: border-box; }
    /* Skip-to-content link — visible only on focus */
    #tamma-nav .tn-skip {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      z-index: 100001;
      background: #fff;
      color: #333;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      text-decoration: none;
    }
    #tamma-nav .tn-skip:focus {
      position: static;
      width: auto;
      height: auto;
      overflow: visible;
      margin-right: 8px;
    }
    #tamma-nav .tn-logo {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      margin-right: 24px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    #tamma-nav .tn-links {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    #tamma-nav .tn-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }
    #tamma-nav .tn-links a:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    #tamma-nav .tn-links a.tn-active {
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-weight: 600;
    }
    #tamma-nav .tn-spacer { flex: 1; }
    #tamma-nav .tn-user {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 6px;
      position: relative;
    }
    #tamma-nav .tn-user-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      background: none;
      border: none;
      color: inherit;
      font: inherit;
    }
    #tamma-nav .tn-user-trigger:hover { background: rgba(255,255,255,0.15); }
    #tamma-nav .tn-user-trigger:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    #tamma-nav .tn-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
    }
    #tamma-nav .tn-username {
      color: #fff;
      font-weight: 500;
      font-size: 13px;
    }
    #tamma-nav .tn-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      min-width: 160px;
      overflow: hidden;
      z-index: 100000;
    }
    #tamma-nav .tn-menu.tn-open { display: block; }
    #tamma-nav .tn-menu a {
      display: block;
      padding: 10px 16px;
      color: #333;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.15s;
    }
    #tamma-nav .tn-menu a:hover { background: #f3f0ff; }
    #tamma-nav .tn-admin { display: none; }
    /* Push host page content below nav bar — needed because the nav is
       position:fixed and would otherwise overlap the page's first content. */
    body { padding-top: 48px !important; }
    /* Mobile: hide labels, show condensed */
    @media (max-width: 640px) {
      #tamma-nav { padding: 0 8px; }
      #tamma-nav .tn-links a { padding: 6px 8px; font-size: 13px; }
      #tamma-nav .tn-username { display: none; }
      #tamma-nav .tn-logo { margin-right: 12px; }
    }
  </style>

  <a class="tn-skip" href="#main-content">Skip to main content</a>

  <a class="tn-logo" href="https://admin.tamma.dev" style="display:flex;align-items:center;gap:8px">
    <img src="https://admin.tamma.dev/logo.png" alt="" style="width:24px;height:24px;border-radius:4px" />
    Tamma
  </a>

  <div class="tn-links">
    <a href="https://admin.tamma.dev" data-svc="app">Dashboard</a>
    <a href="https://elsa.tamma.dev" data-svc="elsa">Workflows</a>
    <a href="https://logs.tamma.dev" data-svc="logs">Logs</a>
    <a href="https://admin.tamma.dev/admin" data-svc="admin" class="tn-admin">Admin</a>
  </div>

  <div class="tn-spacer"></div>

  <div class="tn-user" id="tamma-nav-user">
    <button class="tn-user-trigger" id="tamma-nav-trigger" type="button"
            aria-haspopup="menu" aria-expanded="false">
      <img class="tn-avatar" id="tamma-nav-avatar" src="" alt="" style="display:none" />
      <span class="tn-username" id="tamma-nav-username"></span>
    </button>
    <div class="tn-menu" id="tamma-nav-menu" role="menu">
      <a href="https://admin.tamma.dev/account" role="menuitem">Settings</a>
      <a href="https://admin.tamma.dev/api/auth/logout" role="menuitem" id="tamma-nav-signout">Sign Out</a>
    </div>
  </div>
</nav>

<script>
(function() {
  var nav = document.getElementById('tamma-nav');
  if (!nav) return;

  // Detect active service from hostname
  var host = window.location.hostname;
  var svcMap = {
    'admin.tamma.dev': 'app',
    'elsa.tamma.dev': 'elsa',
    'logs.tamma.dev': 'logs',
    'localhost': 'app'
  };
  var active = svcMap[host] || '';
  var links = nav.querySelectorAll('.tn-links a[data-svc]');
  for (var i = 0; i < links.length; i++) {
    if (links[i].getAttribute('data-svc') === active) {
      links[i].classList.add('tn-active');
      links[i].setAttribute('aria-current', 'page');
    }
  }

  // Toggle user menu via button
  var triggerEl = document.getElementById('tamma-nav-trigger');
  var menuEl = document.getElementById('tamma-nav-menu');
  if (triggerEl && menuEl) {
    triggerEl.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = menuEl.classList.toggle('tn-open');
      triggerEl.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    // Close on outside click
    document.addEventListener('mousedown', function(e) {
      var userEl = document.getElementById('tamma-nav-user');
      if (userEl && !userEl.contains(e.target)) {
        menuEl.classList.remove('tn-open');
        triggerEl.setAttribute('aria-expanded', 'false');
      }
    });
    // Escape key closes menu and returns focus to trigger
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && menuEl.classList.contains('tn-open')) {
        menuEl.classList.remove('tn-open');
        triggerEl.setAttribute('aria-expanded', 'false');
        triggerEl.focus();
      }
    });
  }

  // Sign out via POST then redirect
  var signout = document.getElementById('tamma-nav-signout');
  if (signout) {
    signout.addEventListener('click', function(e) {
      e.preventDefault();
      fetch('https://admin.tamma.dev/api/auth/logout', { method: 'POST', credentials: 'include' })
        .finally(function() { window.location.href = 'https://admin.tamma.dev/login'; });
    });
  }

  // Fetch user identity from shared JWT cookie
  fetch('https://admin.tamma.dev/api/auth/me', { credentials: 'include' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (!data || !data.user) return;
      var u = data.user;
      var avatar = document.getElementById('tamma-nav-avatar');
      var name = document.getElementById('tamma-nav-username');
      if (avatar) {
        avatar.src = 'https://github.com/' + u.username + '.png?size=56';
        avatar.alt = '';
        avatar.style.display = '';
      }
      if (name) name.textContent = u.username;
      // Show admin link for admin/owner
      if (u.role === 'admin' || u.role === 'owner') {
        var adminLink = nav.querySelector('.tn-admin');
        if (adminLink) adminLink.style.display = '';
      }
    })
    .catch(function() {
      // Fallback — nav still works, just no user info
    });
})();
</script>
