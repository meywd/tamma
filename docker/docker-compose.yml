# =============================================================================
# Tamma Platform — Docker Compose (base configuration)
#
# Usage:
#   Development (auto-loads override):  docker compose up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Observability stack (OpenSearch + Dashboards) is opt-in:
#   docker compose --profile observability up -d
#
# Required environment:
#   See .env.example for the full list.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tamma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tamma}
    volumes:
      - tamma-pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tamma}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Infrastructure: RabbitMQ
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tamma}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tamma}
    volumes:
      - tamma-rmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Infrastructure: ChromaDB (vector database)
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:1.5.8
    restart: unless-stopped
    volumes:
      - tamma-chroma-data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
      IS_PERSISTENT: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Intelligence sidecar (TypeScript Fastify bridge to @tamma/intelligence)
  #
  # The C# API delegates its 30 /api/kb/* knowledge-base endpoints here over
  # HTTP instead of porting the entire vector-DB / RAG / MCP stack to C#.
  # Stateless except for the vector-store client configured via env.
  # ---------------------------------------------------------------------------
  intelligence-server:
    build:
      context: ..
      dockerfile: packages/intelligence-server/Dockerfile
    restart: unless-stopped
    environment:
      INTELLIGENCE_PORT: "4100"
      INTELLIGENCE_HOST: "0.0.0.0"
      CHROMADB_URL: http://chromadb:8000
      LOG_LEVEL: ${INTELLIGENCE_LOG_LEVEL:-info}
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4100/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # ELSA .NET Workflow Engine
  # ---------------------------------------------------------------------------
  elsa-server:
    build:
      context: ../apps/tamma-elsa
      dockerfile: src/Tamma.ElsaServer/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tamma};Username=${POSTGRES_USER:-tamma};Password=${POSTGRES_PASSWORD}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-tamma}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-tamma}
      Elsa__Identity__SigningKey: ${ELSA_SIGNING_KEY:-sufficiently-long-secret-signing-key-for-elsa-jwt-tokens}
      Elsa__Identity__AdminUser__Password: ${ELSA_ADMIN_PASSWORD:-password}
      ELSA_SEED_FORCE: ${ELSA_SEED_FORCE:-false}
      TAMMA_SERVICE_API_KEY: ${TAMMA_SERVICE_API_KEY:-}
      TammaApi__BaseUrl: http://tamma-api:3100
      OpenSearch__Url: ${OPENSEARCH_URL:-http://opensearch:9200}
      OpenSearch__Enabled: ${OPENSEARCH_ENABLED:-true}
      OpenSearch__IndexPrefix: tamma-elsa
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # ELSA Studio (Custom Tamma Blazor WASM UI via nginx)
  # ---------------------------------------------------------------------------
  elsa-studio:
    build:
      context: ../apps/tamma-elsa/src
      dockerfile: Tamma.Studio/Dockerfile
    restart: unless-stopped
    environment:
      # URL must be browser-accessible (Blazor WASM runs client-side)
      ELSASERVER__URL: https://elsa.tamma.dev/elsa/api
      # Auto-login: injected into appsettings.json at startup
      ELSA_ADMIN_PASSWORD: ${ELSA_ADMIN_PASSWORD:-password}
    depends_on:
      elsa-server:
        condition: service_healthy
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Tamma C# REST API (consolidated — replaces TS Fastify + .NET ELSA mgmt)
  # ---------------------------------------------------------------------------
  tamma-api:
    build:
      context: ../apps/tamma-elsa/src
      dockerfile: Tamma.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tamma};Username=${POSTGRES_USER:-tamma};Password=${POSTGRES_PASSWORD}"
      # Phase-3 dual connection strings (port-gap findings orgs/002, orgs/004).
      # TammaDb = admin/migrations/background services. TammaAppDb = per-request
      # endpoints connecting as the tamma_app role so Phase-2 RLS policies
      # enforce tenant isolation. If TAMMA_APP_DB_PASSWORD is unset the app
      # connection silently falls back to admin (RLS dormant) per the Phase-3
      # runbook. Operator activates RLS by:
      #   1. psql: ALTER ROLE tamma_app WITH PASSWORD '<rotated>';
      #   2. set TAMMA_APP_DB_PASSWORD in .env
      #   3. restart tamma-api
      ConnectionStrings__TammaDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tamma};Username=${POSTGRES_USER:-tamma};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__TammaAppDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tamma};Username=tamma_app;Password=${TAMMA_APP_DB_PASSWORD:-}"
      ElsaServer__Url: http://elsa-server:5000
      TAMMA_SERVICE_API_KEY: ${TAMMA_SERVICE_API_KEY:-}
      Jwt__Secret: ${JWT_SECRET:-tamma-internal-jwt-secret-change-in-production}
      GitHub__AppId: ${GITHUB_APP_ID:?GITHUB_APP_ID is required}
      GitHub__PrivateKeyPath: /etc/tamma/private-key.pem
      GitHub__WebhookSecret: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
      GitHub__OAuthClientId: ${GITHUB_OAUTH_CLIENT_ID:-}
      GitHub__OAuthClientSecret: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      Dashboard__Url: ${DASHBOARD_URL:-https://app.tamma.dev}
      ChromaDb__Url: http://chromadb:8000
      IntelligenceServer__Url: http://intelligence-server:4100
      IntelligenceServer__TimeoutSeconds: "10"
      OpenSearch__Url: ${OPENSEARCH_URL:-http://opensearch:9200}
      OpenSearch__Enabled: ${OPENSEARCH_ENABLED:-true}
      OpenSearch__IndexPrefix: tamma-api
    volumes:
      - ../secrets/private-key.pem:/etc/tamma/private-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      intelligence-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Tamma Engine (autonomous issue processing)
  # ---------------------------------------------------------------------------
  tamma-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ts
      target: tamma-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tamma}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tamma}"
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID is required}
      GITHUB_APP_PRIVATE_KEY_PATH: /etc/tamma/private-key.pem
      TAMMA_API_URL: http://tamma-api:3100
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-true}
      LOG_INDEX_PREFIX: tamma-ts
      SERVICE_NAME: tamma-engine
    volumes:
      - tamma-engine-workdir:/home/tamma/workdir
      - ../secrets/private-key.pem:/etc/tamma/private-key.pem:ro
    depends_on:
      tamma-api:
        condition: service_started
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Tamma Dashboard (React SPA via nginx)
  # ---------------------------------------------------------------------------
  tamma-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      tamma-api:
        condition: service_started
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Infrastructure: OpenSearch (log aggregation)
  # Opt-in via: docker compose --profile observability up -d
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      cluster.name: tamma-logs
      node.name: tamma-os-node1
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - tamma-os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Infrastructure: OpenSearch Dashboards (log visualization)
  # Opt-in via: docker compose --profile observability up -d
  # ---------------------------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      NODE_OPTIONS: "--max-old-space-size=1024"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q 'overall'"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 5
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Init: OpenSearch bootstrap (index template, ISM policy, saved objects)
  # Opt-in via: docker compose --profile observability up -d
  # ---------------------------------------------------------------------------
  opensearch-setup:
    image: curlimages/curl:8.12.1
    profiles: ["observability"]
    volumes:
      - ./opensearch:/setup:ro
    entrypoint: ["sh", "/setup/setup.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_healthy
    restart: "no"
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # OAuth2 Proxy (GitHub OAuth — unified auth for all subdomains)
  #
  # Runs in nginx auth_request mode: nginx sends a subrequest to /oauth2/auth,
  # oauth2-proxy returns 202 (authenticated) or 401 (redirect to GitHub login).
  # ---------------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    # Healthcheck disabled: v7.6.0+ uses a distroless base image with no shell,
    # wget, or curl, so no CMD probe can work. We rely on `restart: unless-stopped`
    # and verify reachability via nginx-proxy in post-deploy tests.
    healthcheck:
      disable: true
    depends_on:
      tamma-api:
        condition: service_started
    networks:
      - tamma-net

  # ---------------------------------------------------------------------------
  # Reverse Proxy (nginx — routes api.tamma.dev / app.tamma.dev)
  #
  # Hard-depends on tamma-api and tamma-dashboard (critical path).
  # oauth2-proxy and opensearch-dashboards are soft dependencies — nginx
  # resolves them at request time and returns 502 if unavailable.
  # ---------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # Passed through for envsubst in the nginx config template.
      # The nginx Docker image's 20-envsubst-on-templates.sh script only
      # substitutes variables that exist as real env vars, so nginx's own
      # variables ($host, $scheme, etc.) are left untouched.
      ELSA_ADMIN_API_KEY: ${ELSA_ADMIN_API_KEY:-}
    volumes:
      - ./nginx-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nav-header:/etc/nginx/nav-header:ro
      - ./error-pages:/etc/nginx/error-pages:ro
      - ../secrets/origin-cert.pem:/etc/nginx/certs/origin-cert.pem:ro
      - ../secrets/origin-key.pem:/etc/nginx/certs/origin-key.pem:ro
    depends_on:
      tamma-api:
        condition: service_started
      tamma-dashboard:
        condition: service_started
    networks:
      - tamma-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  tamma-pg-data:
  tamma-rmq-data:
  tamma-chroma-data:
  tamma-engine-workdir:
  tamma-os-data:

# =============================================================================
# Networks
# =============================================================================
networks:
  tamma-net:
    driver: bridge
