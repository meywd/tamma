<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - Tamma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
    }
    .status {
      font-size: 72px;
      font-weight: 700;
      color: #7c3aed;
    }
    h1 {
      font-size: 24px;
      margin: 16px 0 8px;
    }
    p {
      color: #999;
      margin: 8px 0;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: #7c3aed;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s;
    }
    a:hover {
      background: #6d28d9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status">403</div>
    <h1>Access Denied</h1>
    <p>
      You don't have permission to view this service.
      Your current role does not grant access to this area.
      Contact your organization administrator to request access.
    </p>
    <a href="https://app.tamma.dev">Return to Dashboard</a>
  </div>
</body>
</html>
