server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy. Epic 19 Phase 3 ("delete TS API package", commit 9e9a57cc)
    # consolidated everything onto the C# Tamma.Api which now serves on
    # port 3100 under the `tamma-api` compose service. The old upstream
    # `tamma-api-dotnet:3000` no longer exists; nginx start-up fails on
    # DNS lookup for it, restart-looping the dashboard container.
    location /api/ {
        proxy_pass http://tamma-api:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
